name: Sync from Navitas28/cog-moat

# Live sync: each run checks the original repo every minute for ~5h50m,
# then starts the next run itself. The schedule is only a backup that
# restarts the loop if it ever stops (GitHub's scheduler is unreliable).
on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch: # "Run workflow" button to start the loop by hand

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if the loop is already running
        id: guard
        run: |
          running=$(gh run list -R "$GITHUB_REPOSITORY" -w sync-upstream.yml -s in_progress \
            --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$running" != "0" ]; then
            echo "Sync loop already running, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Merge new changes from the original repo every minute
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "PriyanshuKumar-CSE"
          git config user.email "221190129+PriyanshuKumar-CSE@users.noreply.github.com"
          end=$((SECONDS + 350 * 60))
          while [ $SECONDS -lt $end ]; do
            git fetch -q origin main && git reset -q --hard origin/main
            git fetch -q https://github.com/Navitas28/cog-moat.git main
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              git merge FETCH_HEAD --no-edit -m "Sync with Navitas28/cog-moat main"
              git push origin HEAD:main
              echo "Synced at $(date -u)"
            fi
            sleep 60
          done

      - name: Start the next run
        if: steps.guard.outputs.skip != 'true' && success()
        run: gh workflow run sync-upstream.yml -R "$GITHUB_REPOSITORY" --ref main
